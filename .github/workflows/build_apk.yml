name: Build MaoneArt Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtMusic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          name: 'MaoneArt Music ${{ steps.app_version.outputs.version }} (Release)'
          body: |
            ## 🎵 MaoneArt Music ${{ steps.app_version.outputs.version }} - Android Release APK
            
            Versi terbaru aplikasi MaoneArt Music dengan fitur efek audio, equalizer hardware, dan update in-place mulus!
            
            ### ✨ Fitur Baru di Versi ${{ steps.app_version.outputs.version }}:
            - 🎛️ **Hardware Equalizer HP**: Buka panel Dolby Atmos / Mi Sound / SoundAlive langsung dari pemutar via Android Intent.
            - ⚡ **Kecepatan Putar Audio**: Kontrol kecepatan playback (0.75x, 1.0x, 1.25x, 1.5x) bebas lag dan responsif.
            - 🔊 **Volume Output Tuning**: Slider volume output presisi dalam modal glassmorphic.
            - 🔑 **Permanent Release Keystore**: Tanda tangan digital permanen sehingga update berikutnya bisa langsung ditimpa (in-place update) tanpa perlu uninstall lagi!
            - 🚀 **Zero-Buffering Playback**: Streaming YouTube super lancar dengan hardware audio offload penuh.
            - 💎 **MaoneArt Glassmorphism UI**: Tampilan ambient glow Spotify-style dengan modal simetris 2-kolom.
            - 🎤 **Lirik Realtime & Mode Karaoke**: Sinkronisasi lirik LRCLIB dan minus-one otomatis.
            
            📥 **Download berkas APK di bawah ini dan instal langsung di perangkat Android Anda!**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          
